<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异构GPU算力资源调度监控大屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body {
            background-color: #0b1121;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.8);
            backdrop-filter: blur(10px);
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-running { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .status-queue { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .status-killed { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-4 box-border">

    <header class="flex justify-between items-center mb-6 px-4">
        <div class="flex items-center gap-3">
            <div class="w-2 h-8 bg-blue-500 rounded-full"></div>
            <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                异构GPU算力资源智能调度监控中心
            </h1>
        </div>
        <div class="text-slate-400 text-sm flex items-center gap-4">
            <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                系统状态: 运行中
            </span>
            <span id="currentTime" class="font-mono bg-slate-800 px-3 py-1 rounded"></span>
        </div>
    </header>

    <div class="grid grid-cols-4 gap-4 mb-4">
        <div class="glass-panel rounded-lg p-4 flex flex-col relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/10 rounded-full blur-xl"></div>
            <span class="text-slate-400 text-sm mb-1">集群GPU总数</span>
            <div class="flex items-end gap-2">
                <span class="text-3xl font-bold text-blue-400" id="kpi-gpus">0</span>
                <span class="text-slate-500 text-sm mb-1">张</span>
            </div>
        </div>
        <div class="glass-panel rounded-lg p-4 flex flex-col relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-cyan-500/10 rounded-full blur-xl"></div>
            <span class="text-slate-400 text-sm mb-1">显存综合利用率</span>
            <div class="flex items-end gap-2">
                <span class="text-3xl font-bold text-cyan-400" id="kpi-util">0.0</span>
                <span class="text-slate-500 text-sm mb-1">%</span>
            </div>
        </div>
        <div class="glass-panel rounded-lg p-4 flex flex-col relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl"></div>
            <span class="text-slate-400 text-sm mb-1">当前运行任务数</span>
            <div class="flex items-end gap-2">
                <span class="text-3xl font-bold text-emerald-400" id="kpi-running">0</span>
                <span class="text-slate-500 text-sm mb-1">个</span>
            </div>
        </div>
        <div class="glass-panel rounded-lg p-4 flex flex-col relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-16 h-16 bg-amber-500/10 rounded-full blur-xl"></div>
            <span class="text-slate-400 text-sm mb-1">队列积压任务数</span>
            <div class="flex items-end gap-2">
                <span class="text-3xl font-bold text-amber-400" id="kpi-queued">0</span>
                <span class="text-slate-500 text-sm mb-1">个</span>
            </div>
        </div>
    </div>

    <div class="flex-1 grid grid-cols-12 gap-4 min-h-0">
        <div class="col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-lg p-4 flex-1 flex flex-col">
                <h3 class="text-sm font-semibold text-slate-300 mb-2 border-l-2 border-blue-500 pl-2">GPU显存容量分布</h3>
                <div id="chartVram" class="flex-1 w-full"></div>
            </div>
            <div class="glass-panel rounded-lg p-4 flex-1 flex flex-col">
                <h3 class="text-sm font-semibold text-slate-300 mb-2 border-l-2 border-cyan-500 pl-2">VRAM碎片率趋势</h3>
                <div id="chartFragment" class="flex-1 w-full"></div>
            </div>
        </div>

        <div class="col-span-5 flex flex-col gap-4">
            <div class="glass-panel rounded-lg p-4 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-semibold text-slate-300 border-l-2 border-purple-500 pl-2">调度延迟趋势</h3>
                    <span class="text-xs text-slate-500">基于 /api/metrics dispatch percentiles</span>
                </div>
                <div id="chartLatency" class="flex-1 w-full"></div>
            </div>
        </div>

        <div class="col-span-4 flex flex-col gap-4">
            <div class="glass-panel rounded-lg p-4 h-1/3 flex flex-col">
                <h3 class="text-sm font-semibold text-slate-300 mb-2 border-l-2 border-amber-500 pl-2">当前优先级队列长度</h3>
                <div id="chartQueue" class="flex-1 w-full"></div>
            </div>

            <div class="glass-panel rounded-lg p-4 flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold text-slate-300 border-l-2 border-emerald-500 pl-2">任务流转（我的任务）</h3>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">实时拉取</span>
                </div>

                <div class="w-full text-sm text-left overflow-y-auto flex-1 pr-1">
                    <table class="w-full relative">
                        <thead class="text-xs text-slate-400 bg-slate-800/50 sticky top-0 z-10">
                            <tr>
                                <th class="px-3 py-2 rounded-tl">任务ID</th>
                                <th class="px-3 py-2">申请规格</th>
                                <th class="px-3 py-2">优先级</th>
                                <th class="px-3 py-2 rounded-tr">状态</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-300" id="taskTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        const API_BASE = (window.location.origin && window.location.origin !== 'null')
            ? window.location.origin
            : 'http://localhost:8080';
        const TOKEN_KEY = 'gpu_scheduler_dashboard_jwt';
        const HISTORY_MAX = 12;

        const darkTheme = {
            textStyle: { fontFamily: 'sans-serif' },
            tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
        };

        const chartVram = echarts.init(document.getElementById('chartVram'));
        const chartFragment = echarts.init(document.getElementById('chartFragment'));
        const chartLatency = echarts.init(document.getElementById('chartLatency'));
        const chartQueue = echarts.init(document.getElementById('chartQueue'));
        const tbody = document.getElementById('taskTableBody');

        const historyState = {
            labels: [],
            fragmentAvgPct: [],
            p50: [],
            p95: []
        };

        let jwtToken = '';

        function initCharts() {
            chartVram.setOption({
                ...darkTheme,
                tooltip: { trigger: 'item' },
                legend: { top: 'bottom', textStyle: { color: '#94a3b8', fontSize: 10 }, itemWidth: 10, itemHeight: 10 },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 4, borderColor: '#0b1121', borderWidth: 2 },
                    label: { show: false, position: 'center' },
                    emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold', color: '#fff' } },
                    labelLine: { show: false },
                    data: [
                        { value: 0, name: '<=8G', itemStyle: { color: '#64748b' } },
                        { value: 0, name: '<=16G', itemStyle: { color: '#06b6d4' } },
                        { value: 0, name: '>16G', itemStyle: { color: '#3b82f6' } }
                    ]
                }]
            });

            chartFragment.setOption({
                ...darkTheme,
                grid: { top: 10, right: 10, bottom: 20, left: 30 },
                xAxis: { type: 'category', data: [], axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
                yAxis: { type: 'value', min: 0, max: 100, splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } }, axisLabel: { color: '#94a3b8', fontSize: 10, formatter: '{value}%' } },
                series: [{
                    data: [],
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { color: '#10b981', width: 3 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(16, 185, 129, 0.4)' },
                            { offset: 1, color: 'rgba(16, 185, 129, 0.0)' }
                        ])
                    }
                }]
            });

            chartLatency.setOption({
                ...darkTheme,
                tooltip: { trigger: 'axis' },
                legend: { data: ['P50调度延迟', 'P95调度延迟'], top: 0, right: 0, textStyle: { color: '#94a3b8', fontSize: 10 } },
                grid: { top: 30, right: 10, bottom: 20, left: 40 },
                xAxis: { type: 'category', boundaryGap: false, data: [], axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' } },
                yAxis: { type: 'value', name: '秒', nameTextStyle: { color: '#94a3b8', fontSize: 10 }, splitLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8' } },
                series: [
                    { name: 'P50调度延迟', type: 'line', smooth: true, data: [], lineStyle: { color: '#8b5cf6', width: 3 }, itemStyle: { color: '#8b5cf6' } },
                    { name: 'P95调度延迟', type: 'line', smooth: true, data: [], lineStyle: { color: '#ef4444', width: 2 }, itemStyle: { color: '#ef4444' } }
                ]
            });

            chartQueue.setOption({
                ...darkTheme,
                grid: { top: 10, right: 20, bottom: 20, left: 30 },
                xAxis: { type: 'category', data: ['P0', 'P1', 'P2'], axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
                series: [{
                    data: [
                        { value: 0, itemStyle: { color: '#ef4444' } },
                        { value: 0, itemStyle: { color: '#f59e0b' } },
                        { value: 0, itemStyle: { color: '#3b82f6' } }
                    ],
                    type: 'bar',
                    barWidth: '40%',
                    itemStyle: { borderRadius: [4, 4, 0, 0] }
                }]
            });
        }

        function requireJwtToken(force = false) {
            if (!force) {
                const cached = localStorage.getItem(TOKEN_KEY);
                if (cached && cached.trim()) {
                    jwtToken = cached.trim();
                    return jwtToken;
                }
            }
            const input = window.prompt('请输入 JWT Token（仅首次打开需要）', '');
            if (!input || !input.trim()) {
                throw new Error('JWT token is required.');
            }
            jwtToken = input.trim();
            localStorage.setItem(TOKEN_KEY, jwtToken);
            return jwtToken;
        }

        function trimHistory(arr) {
            if (arr.length > HISTORY_MAX) {
                arr.splice(0, arr.length - HISTORY_MAX);
            }
        }

        function toNumber(value, fallback = 0) {
            const num = Number(value);
            return Number.isFinite(num) ? num : fallback;
        }

        function parsePercent(value) {
            if (typeof value === 'number') return value;
            if (typeof value === 'string') return toNumber(value.replace('%', ''), 0);
            return 0;
        }

        function findStatusCount(statusMap, keys) {
            if (!statusMap) return 0;
            const entries = Object.entries(statusMap);
            for (const [key, value] of entries) {
                const normalized = key.toLowerCase();
                if (keys.some(k => normalized.includes(k))) {
                    return toNumber(value, 0);
                }
            }
            return 0;
        }

        function getPriorityCounts(queueMap) {
            const counts = { p0: 0, p1: 0, p2: 0 };
            if (!queueMap) return counts;
            for (const [key, value] of Object.entries(queueMap)) {
                const normalized = String(key).toLowerCase();
                const amount = toNumber(value, 0);
                if (normalized.includes('p0') || normalized.includes('urgent') || normalized.includes('紧急')) counts.p0 += amount;
                else if (normalized.includes('p1') || normalized.includes('high') || normalized.includes('高')) counts.p1 += amount;
                else counts.p2 += amount;
            }
            return counts;
        }

        function statusBadgeClass(label) {
            const normalized = String(label || '').toLowerCase();
            if (normalized.includes('running')) return 'status-running';
            if (normalized.includes('queued')) return 'status-queue';
            return 'status-killed';
        }

        function renderTaskTable(records) {
            if (!records || records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-3 py-4 text-xs text-slate-500">暂无任务数据</td></tr>';
                return;
            }
            tbody.innerHTML = records.map(task => {
                const statusLabel = task.statusLabel || String(task.status ?? '-');
                const cls = statusBadgeClass(statusLabel);
                const priority = task.basePriority ?? '-';
                const spec = `${task.minMemoryGb ?? '-'}G`;
                return `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition-colors">
                        <td class="px-3 py-2.5 font-mono text-xs text-blue-300">${task.id ?? '-'}</td>
                        <td class="px-3 py-2.5 text-xs text-slate-400">${spec}</td>
                        <td class="px-3 py-2.5 text-xs text-slate-300">P${priority}</td>
                        <td class="px-3 py-2.5"><span class="status-badge ${cls}">${statusLabel}</span></td>
                    </tr>
                `;
            }).join('');
        }

        async function apiGet(path, retryOnAuth = true) {
            const token = jwtToken || requireJwtToken(false);
            const response = await fetch(`${API_BASE}${path}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if ((response.status === 401 || response.status === 403) && retryOnAuth) {
                localStorage.removeItem(TOKEN_KEY);
                requireJwtToken(true);
                return apiGet(path, false);
            }

            let body = null;
            try {
                body = await response.json();
            } catch (_) {
                throw new Error(`请求失败: ${response.status}`);
            }

            if (!response.ok || body.code !== 200) {
                const msg = body && body.message ? body.message : `请求失败: ${response.status}`;
                throw new Error(msg);
            }
            return body.data;
        }

        function updateFromMetrics(data) {
            const tasks = data && data.tasks ? data.tasks : {};
            const gpus = data && data.gpus ? data.gpus : {};

            document.getElementById('kpi-gpus').innerText = toNumber(gpus.total, 0);
            document.getElementById('kpi-util').innerText = parsePercent(gpus.utilizationRate).toFixed(1);
            document.getElementById('kpi-running').innerText = findStatusCount(tasks.taskCountByStatus, ['running', '执行']);
            document.getElementById('kpi-queued').innerText = toNumber(tasks.queueLength, 0);

            const usedMap = gpus.usedMemoryGbByGpu || {};
            const remainMap = gpus.remainingMemoryGbByGpu || {};
            const bucket = { le8: 0, le16: 0, gt16: 0 };
            const gpuIds = new Set([...Object.keys(usedMap), ...Object.keys(remainMap)]);
            gpuIds.forEach(id => {
                const total = toNumber(usedMap[id], 0) + toNumber(remainMap[id], 0);
                if (total <= 8.5) bucket.le8 += 1;
                else if (total <= 16.5) bucket.le16 += 1;
                else bucket.gt16 += 1;
            });
            chartVram.setOption({
                series: [{
                    data: [
                        { value: bucket.le8, name: '<=8G', itemStyle: { color: '#64748b' } },
                        { value: bucket.le16, name: '<=16G', itemStyle: { color: '#06b6d4' } },
                        { value: bucket.gt16, name: '>16G', itemStyle: { color: '#3b82f6' } }
                    ]
                }]
            });

            const nowLabel = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const fragmentMap = gpus.vramFragmentationByGpu || {};
            const fragmentValues = Object.values(fragmentMap).map(v => toNumber(v, 0) * 100);
            const fragmentAvg = fragmentValues.length ? fragmentValues.reduce((a, b) => a + b, 0) / fragmentValues.length : 0;
            historyState.labels.push(nowLabel);
            historyState.fragmentAvgPct.push(Number(fragmentAvg.toFixed(2)));
            trimHistory(historyState.labels);
            trimHistory(historyState.fragmentAvgPct);

            const latency = tasks.dispatchLatencyPercentilesSeconds || {};
            historyState.p50.push(Number(toNumber(latency.p50, 0).toFixed(2)));
            historyState.p95.push(Number(toNumber(latency.p95, 0).toFixed(2)));
            trimHistory(historyState.p50);
            trimHistory(historyState.p95);

            chartFragment.setOption({
                xAxis: { data: historyState.labels },
                series: [{ data: historyState.fragmentAvgPct }]
            });
            chartLatency.setOption({
                xAxis: { data: historyState.labels },
                series: [{ data: historyState.p50 }, { data: historyState.p95 }]
            });

            const priorityCounts = getPriorityCounts(tasks.queueLengthByPriority);
            chartQueue.setOption({
                series: [{
                    data: [
                        { value: priorityCounts.p0, itemStyle: { color: '#ef4444' } },
                        { value: priorityCounts.p1, itemStyle: { color: '#f59e0b' } },
                        { value: priorityCounts.p2, itemStyle: { color: '#3b82f6' } }
                    ]
                }]
            });
        }

        async function refreshDashboard() {
            const metrics = await apiGet('/api/metrics', true);
            updateFromMetrics(metrics);
            try {
                const pageData = await apiGet('/api/metrics/tasks/stream?page=1&size=12&activeOnly=true&sortBy=updatedAt&sortDir=desc', true);
                renderTaskTable(pageData && pageData.records ? pageData.records : []);
            } catch (_) {
                renderTaskTable([]);
            }
        }

        window.addEventListener('resize', () => {
            chartVram.resize();
            chartFragment.resize();
            chartLatency.resize();
            chartQueue.resize();
        });

        async function bootstrap() {
            initCharts();
            renderTaskTable([]);
            requireJwtToken(false);
            await refreshDashboard();
            setInterval(async () => {
                try {
                    await refreshDashboard();
                } catch (error) {
                    console.error(error);
                }
            }, 3000);
        }

        bootstrap().catch(err => {
            console.error(err);
            alert(`初始化失败: ${err.message}`);
        });
    </script>
</body>
</html>
